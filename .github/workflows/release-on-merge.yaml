name: Release on merge

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increment patch version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("custom_components/amps_fridge_ble_ha/manifest.json")
          manifest = json.loads(manifest_path.read_text())
          major, minor, patch = (int(part) for part in manifest["version"].split("."))
          version = f"{major}.{minor}.{patch + 1}"
          manifest["version"] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(version)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/amps_fridge_ble_ha/manifest.json
          git commit -m "Bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --generate-notes
